services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://notify:notify123@postgres:5432/notify_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify123
      POSTGRES_DB: notify_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify_db"]
      interval: 5s
      timeout: 5s
      retries: 10
